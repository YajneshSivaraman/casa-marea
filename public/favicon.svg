
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep Mediterranean sea background -->
  <rect width="64" height="64" rx="14" fill="#173C3A"/>

  <!-- Elegant ivory sun -->
  <circle cx="43" cy="20" r="8" fill="#E8D8B5"/>

  <!-- Stylized coastal wave -->
  <path
    d="M9 34
       C17 25 25 25 33 34
       S49 43 57 32"
    fill="none"
    stroke="#E8D8B5"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Second wave for a layered sea effect -->
  <path
    d="M8 44
       C17 36 25 36 34 44
       S49 52 56 43"
    fill="none"
    stroke="#A9C8BC"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
