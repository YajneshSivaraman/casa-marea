<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CASA MAREA brand identity -->
    <title>CASA MAREA</title>
    <meta
      name="description"
      content="Discover CASA MAREA, a Mediterranean-inspired coastal experience shaped by timeless design, natural textures, and effortless elegance."
    />
    <meta name="theme-color" content="#173C3A" />
    <meta name="color-scheme" content="light" />

    <!-- Custom coastal favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CASA MAREA" />
    <meta
      property="og:title"
      content="CASA MAREA — Mediterranean Coastal Living"
    />
    <meta
      property="og:description"
      content="A quieter kind of luxury. Inspired by the Mediterranean, shaped by the sea."
    />

    <!-- Twitter/X link previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CASA MAREA — Mediterranean Coastal Living"
    />
    <meta
      name="twitter:description"
      content="Timeless coastal design. Natural textures. Mediterranean soul."
    />

    <!-- Vite entry point: required to launch the React app -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <!-- React renders the CASA MAREA website inside this element -->
    <div id="root"></div>
  </body>
</html>
